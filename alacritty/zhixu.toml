# Zhixu — Everything in its place. Colors from ../PALETTE.md.

[window]
opacity = 1.0

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#101112"
foreground = "#E3DCD3"
dim_foreground = "#9B8D80"
bright_foreground = "#F0E9E1"

[colors.cursor]
text = "#101112"
cursor = "#DDB08C"

[colors.vi_mode_cursor]
text = "#101112"
cursor = "#DDB08C"

[colors.selection]
text = "CellForeground"
background = "#43382F"

[colors.search.matches]
foreground = "#E3DCD3"
background = "#2F2924"

[colors.search.focused_match]
